<style>
/* Layout: fixed left catalogue (search + Curated/Sources/Topics tree), a scrolling centre
   panel for the selected collection or series, and a SQL dock that stays open across
   navigation. Centre content max 72rem. */
:root{
  /* Light, Brazil-flag palette: green (verde-bandeira), yellow (amarelo), navy (azul) on a
     pale-yellow paper. Single light theme by design. */
  --paper:#fffdf4; --side:#f2f7ec; --card:#ffffff; --ink:#0e2a1b; --ink-2:#3d5446; --ink-3:#56695c;
  --rule:#dbe5d3; --hover:#e8f2df; --sel:#fff1a8; --accent:#009c3b; --accent-ink:#00702b; --accent-bg:#e2f4e7;
  --yellow:#ffdf00; --navy:#002776; --on-accent:#ffffff;
  --ok:#00702b; --ok-bg:#e2f4e7; --no:#b3261e; --no-bg:#fbe4e1; --mixed:#7a5600; --mixed-bg:#fff3c4;
  --na:#56695c; --na-bg:#edf1ea;
  --c1:#009c3b; --c2:#2f57b5; --c3:#e8a600; --c4:#e4572e; --c5:#7a4fc4; --c6:#1a9dc2; --c7:#0e2a1b;
  --grid:#e9eee4;
  --left:rgba(228,87,46,.10); --left-ink:#b3261e; --centre:rgba(86,105,92,.10); --centre-ink:#56695c; --right:rgba(47,87,181,.10); --right-ink:#2f57b5;
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans:"Public Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sideW:21rem; --dockH:0px;
  color-scheme:light;
}
:root.theme-dark{
  /* Soft dark: near-neutral charcoal with a faint green cast; sage accent, muted flag yellow. */
  --paper:#151816; --side:#191d1a; --card:#1c211e; --ink:#e6e9e6; --ink-2:#b9c0bb; --ink-3:#979f99;
  --rule:#2c332e; --hover:#232925; --sel:#3a3720; --accent:#7cc29a; --accent-ink:#9ad3b1; --accent-bg:#233229;
  --on-accent:#121513; --yellow:#e8cf5a;
  --ok:#9ad3b1; --ok-bg:#223127; --no:#eb9f95; --no-bg:#3a2321; --mixed:#e3c46f; --mixed-bg:#36301a;
  --na:#a5ada7; --na-bg:#242a26;
  --c1:#7cc29a; --c2:#8ea9e8; --c3:#e3c46f; --c4:#e8907a; --c5:#b39ae0; --c6:#72bfd6; --c7:#e6e9e6;
  --grid:#242a26;
  --left:rgba(232,144,122,.12); --left-ink:#eba48f; --centre:rgba(165,173,167,.09); --centre-ink:#a5ada7; --right:rgba(142,169,232,.13); --right-ink:#a9bdee;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--accent);color:var(--paper)}
a{color:var(--accent-ink);text-underline-offset:.18em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono);font-size:.9em}

.app{display:grid;grid-template-columns:var(--sideW) minmax(0,1fr);height:100%;padding-top:env(safe-area-inset-top,0px)}
.app.collapsed{--sideW:0px}
.app.collapsed .side{visibility:hidden}

/* ---- sidebar */
.side{background:var(--side);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.side-top{padding:.75rem .75rem .5rem;display:grid;gap:.6rem;border-bottom:1px solid var(--rule)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.brand{font:700 1.05rem/1 var(--serif);color:var(--ink);text-decoration:none}
.brand span{color:var(--accent)}
.brand{display:inline-flex;align-items:center;gap:.5rem}
.flag{width:1.55rem;height:1.1rem;flex:none;filter:drop-shadow(0 1px 1px rgb(0 0 0 / .18))}
.iconbtn{background:none;border:1px solid transparent;border-radius:6px;width:2rem;height:2rem;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--hover);border-color:var(--rule)}
.iconbtn svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn.gh svg{fill:currentColor;stroke:none;width:1.15rem;height:1.15rem}
a.iconbtn{text-decoration:none}
.search{display:flex;align-items:center;gap:.45rem;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:.4rem .6rem}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search svg{width:.95rem;height:.95rem;flex:none;stroke:var(--ink-3);fill:none;stroke-width:2}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--hover);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:.35rem 0;font-weight:600;font-size:.8125rem;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tree{flex:1;overflow:auto;padding:.4rem .4rem 1rem}
.tree ul{list-style:none;margin:0;padding:0}
.node{display:flex;align-items:center;gap:.35rem;width:100%;text-align:left;background:none;border:0;border-radius:6px;
  padding:.38rem .5rem;color:var(--ink);font-size:.8125rem;text-decoration:none}
.node:hover{background:var(--hover)}
.node[aria-current="true"]{background:var(--sel);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.node .tw{width:.9rem;flex:none;color:var(--ink-3);transition:transform .15s}
.node[aria-expanded="true"] .tw{transform:rotate(90deg)}
.node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.two{align-items:flex-start}
.node.two .ic{margin-top:.2rem}
.node .lbl small{display:block;font-size:.6875rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{color:var(--ink-3);font-size:.75rem;font-variant-numeric:tabular-nums}
.node .tag{font-size:.6875rem;color:var(--ink-3);border:1px solid var(--rule);border-radius:4px;padding:0 .3rem}
.tree ul ul{padding-left:.9rem}
.leaf{position:relative}
.leaf .node{padding-right:2rem}
.plus{position:absolute;right:.25rem;top:50%;transform:translateY(-50%);width:1.5rem;height:1.5rem;border-radius:6px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-weight:700;line-height:1;opacity:0}
.leaf:hover .plus,.plus:focus-visible,.leaf .node[aria-current="true"] + .plus{opacity:1}
@media (hover:none){.plus{opacity:.8}}
.plotbar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.75rem 1rem .25rem}
.pchip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--rule);border-radius:999px;padding:.2rem .3rem .2rem .6rem;font-size:.78rem;background:var(--paper);max-width:24rem}
.pchip i{width:.65rem;height:.65rem;border-radius:2px;flex:none}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip button{border:0;background:none;color:var(--ink-3);width:1.3rem;height:1.3rem;border-radius:50%;line-height:1}
.pchip button:hover{background:var(--hover);color:var(--ink)}
.addbtn{display:inline-flex;align-items:center;gap:.35rem;border:1.5px dashed var(--accent);color:var(--accent-ink);background:var(--accent-bg);
  border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.8rem}
.addbtn:hover{border-style:solid}
.picker{position:relative;flex:1 1 16rem;max-width:26rem}
.picker input{width:100%;border:1px solid var(--accent);border-radius:8px;padding:.35rem .6rem;background:var(--card);outline:0;box-shadow:0 0 0 3px var(--accent-bg)}
.picker ul{position:absolute;z-index:15;left:0;right:0;top:calc(100% + .25rem);list-style:none;margin:0;padding:.25rem;background:var(--card);
  border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgb(0 0 0 / .18);max-height:18rem;overflow:auto}
.picker li button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:.4rem .5rem;font-size:.8rem}
.picker li button:hover,.picker li button.hl{background:var(--hover)}
.picker li small{display:block;color:var(--ink-3);font-size:.7rem}
.modes{margin-left:auto;display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px}
.modes button{border:0;background:none;border-radius:999px;padding:.15rem .6rem;font-size:.75rem;font-weight:600;color:var(--ink-2)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tree .ic{width:.85rem;height:.85rem;flex:none;stroke:var(--ink-3);fill:none;stroke-width:1.6}
.side-foot{border-top:1px solid var(--rule);padding:.5rem .6rem;display:flex;flex-wrap:wrap;gap:.15rem .25rem}
.side-foot a{font-size:.75rem;color:var(--ink-2);text-decoration:none;padding:.25rem .4rem;border-radius:5px}
.side-foot a:hover,.side-foot a[aria-current="true"]{background:var(--hover);color:var(--ink)}
.side-foot .stat{width:100%;font-size:.6875rem;color:var(--ink-3);padding:.25rem .4rem 0}

/* ---- main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow:auto;min-height:0}
.topbar{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.25rem;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:5}
.crumbs{font-size:.8125rem;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--ink-2);text-decoration:none} .crumbs a:hover{text-decoration:underline}
.crumbs .sep{margin:0 .4rem}
.tray{display:flex;align-items:center;gap:.4rem}
.btn{background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:.35rem .8rem;font-weight:600;font-size:.8125rem;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.content{max-width:72rem;margin:0 auto;padding:1.75rem clamp(1rem,3vw,2.25rem) 4rem}
.head h1{font-size:clamp(1.6rem,3.4vw,2.15rem);line-height:1.15}
.head .lede{max-width:72ch;color:var(--ink-2);margin-top:.6rem;font-size:.95rem}
.badges{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem;align-items:center}
.badge{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--rule);border-radius:999px;padding:.2rem .65rem;font-size:.75rem;color:var(--ink-2);background:var(--card)}
.actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-left:auto}
.headrow{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.pill{display:inline-flex;align-items:center;padding:.1rem .5rem;border-radius:999px;font-weight:600;font-size:.6875rem;white-space:nowrap}
.pill.fresh,.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.stale,.pill.mixed{color:var(--mixed);background:var(--mixed-bg)}
.pill.alternate,.pill.na{color:var(--na);background:var(--na-bg)} .pill.derived{color:var(--accent-ink);background:var(--accent-bg)} .pill.no{color:var(--no);background:var(--no-bg)}

.kpis{border-top:3px solid var(--yellow)!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:1.5rem;background:var(--card)}
.kpi{padding:1rem 1.1rem;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);display:block;margin:0 -1px -1px 0}
.kpi:hover{background:var(--hover)}
.kpi strong{display:block;font:600 1.45rem/1.15 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .k{font-size:.75rem;color:var(--ink-2);margin-top:.3rem}
.kpi .d{font-size:.6875rem;color:var(--ink-3);margin-top:.15rem}
.up{color:var(--ok)} .down{color:var(--no)}

.panel{border:1px solid var(--rule);border-radius:10px;background:var(--card);margin-top:1.25rem;overflow:hidden}
.panel-h{padding:.85rem 1rem .25rem}
.panel-h h3{font:600 .95rem/1.3 var(--sans)}
.panel-h p{font-size:.8125rem;color:var(--ink-2);margin-top:.2rem;max-width:80ch}
.panel-b{padding:.25rem .75rem .5rem}
.panel-f{display:flex;flex-wrap:wrap;gap:.35rem;padding:.6rem 1rem .85rem;border-top:1px solid var(--rule)}
.tchip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--rule);border-radius:6px;padding:.15rem .5rem;font:500 .75rem var(--mono);color:var(--ink-2);text-decoration:none;background:var(--paper)}
.tchip:hover{border-color:var(--ink-3);color:var(--ink)}
.tchip i{width:.55rem;height:.55rem;border-radius:2px;display:inline-block}
.sec-title{font-size:1.25rem;margin-top:2.25rem}
.sec-desc{font-size:.875rem;color:var(--ink-2);margin-top:.35rem;max-width:80ch}
.chart{width:100%;min-height:320px}
.stabs{display:flex;gap:1.25rem;border-bottom:1px solid var(--rule);margin-top:1.5rem}
.stabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.55rem 0;font-weight:600;font-size:.9rem;color:var(--ink-3);margin-bottom:-1px}
.stabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stabs + div > .panel:first-child{margin-top:1rem}
.ranges{display:flex;gap:.25rem}
.ranges button{background:none;border:1px solid var(--rule);border-radius:6px;padding:.12rem .5rem;font-size:.75rem;font-weight:600;color:var(--ink-2)}
.ranges button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.75rem;color:var(--ink-2);padding:.2rem .25rem .35rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:.9rem;height:.18rem;border-radius:2px;display:inline-block}
.note{font-size:.75rem;color:var(--ink-3);padding:0 .25rem .35rem}
.pol-legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.72rem;color:var(--ink-3);padding:0 .25rem .4rem}
.pol-legend i{display:inline-block;width:.8rem;height:.6rem;border-radius:2px;vertical-align:middle;margin-right:.3rem}
.lean{display:inline-block;padding:.05rem .45rem;border-radius:999px;font-size:.6875rem;font-weight:600}
.lean.left{background:var(--left);color:var(--left-ink)} .lean.right,.lean.centre-right{background:var(--right);color:var(--right-ink)} .lean.centre{background:var(--centre);color:var(--centre-ink)}

table{border-collapse:collapse;width:100%;font-size:.8125rem}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--rule);vertical-align:top;white-space:nowrap}
thead th{font-weight:600;color:var(--ink-3);background:var(--paper)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono);font-size:.78rem}
td.wrap{white-space:normal;min-width:16rem}
.rows-n{display:inline-block;margin:.6rem .75rem;font-size:.75rem;color:var(--ink-3);background:var(--paper);border-radius:5px;padding:.1rem .45rem}

.empty{padding:2rem 0;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:.5rem;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:.55rem 1rem .55rem .8rem;font-weight:600;font-size:.85rem;
  box-shadow:0 8px 24px rgb(0 0 0 / .22);animation:toastin .18s ease-out}
.toast svg{width:1rem;height:1rem;stroke:var(--yellow);fill:none;stroke-width:2.4}
@keyframes toastin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.hits{list-style:none;padding:0;margin:.4rem 0 0;display:grid;gap:.35rem;font-size:.8125rem}
.hits .pub{color:var(--ink-3)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1.25rem 2rem;align-items:start}
pre{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:.8rem;overflow-x:auto;font:400 .78rem/1.5 var(--mono)}
.mobile-only{display:none}

@media (max-width:60rem){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100%}
  .side{position:fixed;inset:0 auto 0 0;width:min(22rem,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax transparent}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgb(0 0 0 / .35)}
  .app.collapsed .side{visibility:visible}
  .mobile-only{display:grid}
  .scroll{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="main">
    <div class="scroll" id="scroll">
      <div class="topbar">
        <button class="iconbtn mobile-only" id="openSide" aria-label="Open catalogue"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button class="iconbtn" id="expand" hidden aria-label="Show catalogue" title="Show catalogue"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>

      </div>

<script src="{{PLOTLY}}"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SLOTS = ['--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
const FONT = '"Public Sans", "Helvetica Neue", Arial, sans-serif';
const fmt = v => v == null ? '—' : Math.abs(v) >= 1e12 ? (v/1e12).toLocaleString('en', {maximumFractionDigits: 2}) + ' tn'
  : Math.abs(v) >= 1e9 ? (v/1e9).toLocaleString('en', {maximumFractionDigits: 2}) + ' bn'
  : Math.abs(v) >= 1e6 ? (v/1e6).toLocaleString('en', {maximumFractionDigits: 2}) + ' mn'
  : v.toLocaleString('en', {maximumFractionDigits: Math.abs(v) >= 100 ? 1 : 2});
const day = d => new Date(d * 864e5).toISOString().slice(0, 10);
const toHash = id => 's-' + id.replace('@', '~~').replace('/', '~');
const fromHash = h => h.slice(2).replace('~~', '@').replace('~', '/');
const store = {get(k, d){ try { const v = localStorage.getItem('bmd-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
               set(k, v){ try { localStorage.setItem('bmd-' + k, JSON.stringify(v)); } catch (e) {} }};
const ICON_T = '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 6.5h12M6 6.5V13"/></svg>';
const ICON_C = '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13l4-5 3 3 5-7"/></svg>';

let CAT = [], BY = new Map(), META = {}, chunks = new Map(), CUR = [];
let tab = store.get('tab', 'curated'), q = '', compare = store.get('compare', []);
const open = new Set(store.get('open', []));
const redraws = new Set();

async function getJSON(p){ const r = await fetch(p); if (!r.ok) throw new Error(p + ': HTTP ' + r.status); return r.json(); }
async function series(id){
  const s = BY.get(id); if (!s || s.ch < 0) return null;
  if (!chunks.has(s.ch)) chunks.set(s.ch, getJSON('data/obs-' + String(s.ch).padStart(3, '0') + '.json'));
  const v = (await chunks.get(s.ch))[id]; return v ? {x: v[0].map(day), y: v[1]} : null;
}

// ------------------------------------------------------------------ sidebar tree
function groupBy(arr, f){ const m = new Map(); arr.forEach(s => { const k = f(s) || 'Other'; if (!m.has(k)) m.set(k, []); m.get(k).push(s); }); return m; }
function leaf(s, depth){
  const cur = location.hash === '#' + toHash(s.id);
  return `<li class="leaf"><a class="node two" href="#${toHash(s.id)}" aria-current="${cur}" title="${esc(s.t)}&#10;${esc(s.dset)}">${ICON_T}<span class="lbl">${esc(s.t)}<small>${esc(s.dset)} · ${esc(s.f)} · ${esc(s.a.slice(0, 4))}–${esc(s.b.slice(0, 4))}</small></span>` +
    (s.r === 'alternate' ? '<span class="tag">alt</span>' : '') + `</a><button class="plus" data-plot="${esc(s.id)}" aria-label="Add ${esc(s.t)} to the chart" title="Add to chart">+</button></li>`;
}
function branch(key, label, items, sub){
  const isOpen = open.has(key);
  return `<li><button class="node" data-key="${esc(key)}" aria-expanded="${isOpen}"><span class="tw">›</span><span class="lbl">${esc(label)}</span><span class="ct">${items.length.toLocaleString('en')}</span></button>` +
    (isOpen ? `<ul>${sub ? sub() : items.slice(0, 400).map(leaf).join('') + (items.length > 400 ? `<li class="note">${items.length - 400} more — use search</li>` : '')}</ul>` : '') + '</li>';
}
function renderTree(){
  const el = $('#tree');
  if (q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = CAT.map(s => { const hay = (s.t + ' ' + s.id + ' ' + s.tp + ' ' + s.src + ' ' + s.dset + ' ' + s.ent + ' ' + s.m + ' ' + s.ds).toLowerCase();
      if (!terms.every(t => hay.includes(t))) return null;
      const tl = s.t.toLowerCase(); const txt = terms.reduce((a, t) => a + (tl.startsWith(t) ? 4 : tl.includes(t) ? 3 : 1), 0);
      return [s, txt * (1 + s.rk) - tl.length / 200]; })
      .filter(Boolean).sort((a, b) => b[1] - a[1]);
    el.innerHTML = `<p class="note" style="padding:.4rem .5rem">${hits.length.toLocaleString('en')} datasets match “${esc(q)}”</p><ul>` +
      hits.slice(0, 300).map(([s]) => leaf(s)).join('') + '</ul>';
    return;
  }
  if (tab === 'curated') {
    el.innerHTML = '<ul>' + CUR.map(c => `<li><a class="node" href="#c-${c.id}" aria-current="${location.hash === '#c-' + c.id}">${ICON_C}<span class="lbl">${esc(c.title)}</span>` +
      `<span class="ct">${new Set(c.charts.flatMap(x => x.s).concat(c.kpis)).size}</span></a></li>`).join('') + '</ul>';
    return;
  }
  const top = groupBy(CAT, s => tab === 'sources' ? s.src : s.tp);
  const keys = [...top.keys()].sort((a, b) => top.get(b).length - top.get(a).length);
  el.innerHTML = '<ul>' + keys.map(k => {
    const items = top.get(k);
    const subKey = s => tab === 'sources' ? s.dset : (s.ent !== 'Brazil' ? s.ent : s.dset);
    const subs = groupBy(items, subKey);
    const useSub = subs.size > 1 && items.length > 12;
    items.sort((a, b) => b.rk - a.rk);
    return branch(tab + ':' + k, k, items, useSub ? () => [...subs.keys()].sort((a, b) => subs.get(b).length - subs.get(a).length)
      .map(sk => branch(tab + ':' + k + ':' + sk, sk, subs.get(sk).sort((a, b) => b.rk - a.rk))).join('') : null);
  }).join('') + '</ul>';
}

// ------------------------------------------------------------------ charts
function layout(h, ytitle){
  return {height: h, margin: {l: 56, r: 14, t: 6, b: 30}, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: {family: FONT, size: 11.5, color: css('--ink-2')}, showlegend: false, hovermode: 'x unified',
    hoverlabel: {bgcolor: css('--card'), bordercolor: css('--rule'), font: {family: FONT, color: css('--ink'), size: 12}},
    xaxis: {showgrid: false, linecolor: css('--rule'), ticks: 'outside', tickcolor: css('--rule')},
    yaxis: {gridcolor: css('--grid'), zeroline: false, automargin: true, title: ytitle ? {text: ytitle, font: {size: 11}} : undefined}};
}
// ---- political overlay: presidential terms (bands by lean) + events (markers with hover)
let politics = store.get('politics', false);
const LEAN = l => l === 'left' ? 'left' : (l === 'right' || l === 'centre-right') ? 'right' : 'centre';
function overlay(L, traces, xs){
  if (!politics || !META.politics || !xs.length) return traces;
  const lo = xs.reduce((a, b) => a < b ? a : b), hi = xs.reduce((a, b) => a > b ? a : b);
  L.shapes = L.shapes || []; L.annotations = L.annotations || [];
  for (const t of META.politics.terms) {
    const a = t.start > lo ? t.start : lo, b = t.end < hi ? t.end : hi; if (a >= b) continue;
    const k = LEAN(t.lean);
    L.shapes.push({type: 'rect', layer: 'below', xref: 'x', yref: 'paper', x0: a, x1: b, y0: 0, y1: 1, fillcolor: css('--' + k), line: {width: 0}});
    L.shapes.push({type: 'line', layer: 'below', xref: 'x', yref: 'paper', x0: a, x1: a, y0: 0, y1: 1, line: {color: css('--rule'), width: 1}});
    const span = (new Date(b) - new Date(a)) / (new Date(hi) - new Date(lo));
    if (span > .07) L.annotations.push({xref: 'x', yref: 'paper', x: a, y: 0, xanchor: 'left', yanchor: 'bottom', xshift: 3, yshift: 2, showarrow: false,
      text: t.president.split(' ').slice(-1)[0] === 'Silva' ? 'Lula' : t.president.split(' ').slice(-1)[0], font: {size: 10, color: css('--' + k + '-ink')}});
  }
  const ev = META.politics.events.filter(e => e.date >= lo && e.date <= hi);
  ev.forEach(e => L.shapes.push({type: 'line', xref: 'x', yref: 'paper', x0: e.date, x1: e.date, y0: 0, y1: .93,
    line: {color: css('--ink-3'), width: 1, dash: 'dot'}}));
  if (ev.length) {
    L.yaxis2 = {overlaying: 'y', range: [0, 1], visible: false, fixedrange: true};
    traces = traces.concat([{type: 'scatter', mode: 'markers', yaxis: 'y2', x: ev.map(e => e.date), y: ev.map(() => .965),
      marker: {symbol: 'diamond', size: 8, color: ev.map(e => e.kind === 'election' ? css('--accent') : css('--ink-3'))},
      text: ev.map(e => e.date + ' · ' + e.event), hovertemplate: '%{text}<extra></extra>', showlegend: false}]);
    L.hovermode = 'closest';
  }
  return traces;
}
function polLegend(){ return politics ? `<p class="pol-legend"><span><i style="background:${css('--left')}"></i>Left president</span><span><i style="background:${css('--centre')}"></i>Centre</span>` +
  `<span><i style="background:${css('--right')}"></i>Right / centre-right</span><span>◆ event (hover) · <span style="color:${css('--accent')}">◆</span> election</span></p>` : ''; }
function rebase(d, t0){ const k = d.x.findIndex(v => v >= t0); const b = k < 0 ? null : d.y[k]; return {x: d.x, y: d.y.map(v => v == null || !b ? null : v / b * 100)}; }
async function multiChart(el, ids, h){
  const data = await Promise.all(ids.map(series));
  const fam = u => /^%|percentage points|% of/.test(u || '') ? '%' : u;
  const units = new Set(ids.map(id => fam(BY.get(id).u)));
  const rebased = units.size > 1;
  const t0 = rebased ? data.filter(Boolean).map(d => d.x[0]).sort().pop() : null;
  const draw = () => {
    if (!window.Plotly || !el.isConnected) return;
    const tr = data.map((d, i) => { if (!d) return null; const z = rebased ? rebase(d, t0) : d;
      return {type: 'scatter', mode: z.x.length < 60 ? 'lines+markers' : 'lines', x: z.x, y: z.y, name: BY.get(ids[i]).t,
        line: {color: css(SLOTS[i % SLOTS.length]), width: 1.9}, marker: {size: 4}, hovertemplate: '%{y:,.4~g}<extra>' + esc(BY.get(ids[i]).t).slice(0, 38) + '</extra>'}; }).filter(Boolean);
    const L = layout(h, rebased ? `Index, ${t0.slice(0, 7)} = 100` : ([...units][0] === '%' && ids.length > 1 ? '%' : BY.get(ids[0]).u));
    Plotly.react(el, overlay(L, tr, tr.flatMap(t => [t.x[0], t.x[t.x.length - 1]])), L, {displayModeBar: false, responsive: true});
    const lg = el.parentElement.querySelector('.pol-slot'); if (lg) lg.innerHTML = polLegend();
  };
  draw(); redraws.add(draw);
  return rebased;
}
function onTheme(){ redraws.forEach(f => f()); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

// ------------------------------------------------------------------ views
function crumbs(parts){ $('#crumbs').innerHTML = parts.map(([l, h]) => h ? `<a href="${h}">${esc(l)}</a>` : `<span>${esc(l)}</span>`).join('<span class="sep">/</span>'); }
function chips(ids){ return ids.map((id, i) => `<a class="tchip" href="#${toHash(id)}" title="${esc(BY.get(id)?.t)}"><i style="background:${css(SLOTS[i % SLOTS.length])}"></i>${esc(id)}</a>`).join(''); }
async function kpiHTML(id){
  const s = BY.get(id); const d = await series(id); let ch = '';
  if (d && d.x.length > 2) { const last = new Date(d.x[d.x.length - 1]); last.setFullYear(last.getFullYear() - 1); const iso = last.toISOString().slice(0, 10);
    let j = -1; for (let k = d.x.length - 1; k >= 0; k--) if (d.x[k] <= iso) { j = k; break; }
    if (j >= 0 && d.y[j] != null && s.lv != null) { const pctU = /%|percentage/.test(s.u + ' ' + s.t); const delta = pctU ? s.lv - d.y[j] : (s.lv / d.y[j] - 1) * 100;
      ch = `<span class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '+' : ''}${delta.toFixed(pctU ? 2 : 1)}${pctU ? ' pts' : '%'}</span> vs a year earlier`; } }
  return `<a class="kpi" href="#${toHash(id)}"><strong>${fmt(s.lv)}</strong><p class="k">${esc(s.t)}</p><p class="d">${esc(s.u)} · ${esc(s.b)}</p>${ch ? `<p class="d">${ch}</p>` : ''}</a>`;
}
async function showCurated(id){
  const c = CUR.find(x => x.id === id) || CUR[0];
  crumbs([]);
  const nSeries = new Set(c.charts.flatMap(x => x.s).concat(c.kpis)).size;
  $('#view').innerHTML = `<div class="head"><h1>${esc(c.title)}</h1><p class="lede">${esc(c.desc)}</p>
    <div class="badges"><span class="badge">${nSeries} series</span>${[...new Set(c.charts.flatMap(x => x.s).map(i => BY.get(i).src))].map(s => `<span class="badge">${esc(s)}</span>`).join('')}</div></div>
    <div class="kpis" id="kpis"></div>` +
    c.charts.map((ch, i) => `<h2 class="sec-title">${esc(ch.t)}</h2><p class="sec-desc">${esc(ch.d)}</p><div class="panel"><div class="panel-b">
      <div class="legend">${ch.s.map((sid, k) => `<span><i style="background:${css(SLOTS[k % SLOTS.length])}"></i>${esc(BY.get(sid).t)}</span>`).join('')}</div>
      <div class="chart" id="cc${i}" role="img" aria-label="${esc(ch.t)}"></div><div class="pol-slot"></div><p class="note" id="cn${i}"></p></div>
      <div class="panel-f">${chips(ch.s)}</div></div>`).join('');
  $('#kpis').innerHTML = (await Promise.all(c.kpis.map(kpiHTML))).join('');
  c.charts.forEach(async (ch, i) => { const r = await multiChart($('#cc' + i), ch.s, 320); if (r) $('#cn' + i).textContent = 'Units differ, so every series is rebased to 100 at the latest common start.'; });
}
let stab = 'chart', plotIds = [], plotDraw = null, plotMode = 'auto';
const plotExtra = store.get('plotExtra', {});   // series page id -> extra ids drawn with it
function curSeries(){ const h = location.hash.slice(1); return h.startsWith('s-') ? fromHash(h) : null; }
function addToPlot(x){
  const base = curSeries();
  if (!base) { toggleCompare(x); location.hash = 'compare'; return; }
  if (x === base) return;
  const ex = plotExtra[base] || []; if (!ex.includes(x)) plotExtra[base] = [...ex, x].slice(-6);
  store.set('plotExtra', plotExtra); plotIds = [base, ...plotExtra[base]];
  if (plotDraw) { stab = 'chart'; const c = $('#sp-chart'); if (c) { c.hidden = false; $('#sp-details').hidden = true;
    document.querySelectorAll('.stabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.stab === 'chart')); } plotDraw(); }
}
function removeFromPlot(x){ const base = curSeries(); if (!base) return; plotExtra[base] = (plotExtra[base] || []).filter(y => y !== x); store.set('plotExtra', plotExtra);
  plotIds = [base, ...plotExtra[base]]; if (plotDraw) plotDraw(); }
function renderPlotbar(){
  const el = $('#plotbar'); if (!el) return;
  el.innerHTML = plotIds.map((x, i) => `<span class="pchip"><i style="background:${css(SLOTS[i])}"></i><span title="${esc(BY.get(x).t)} · ${esc(BY.get(x).u)}">${esc(BY.get(x).t)}</span>` +
    (i ? `<button data-unplot="${esc(x)}" aria-label="Remove ${esc(BY.get(x).t)}">✕</button>` : '<span style="width:.3rem"></span>') + '</span>').join('') +
    (plotIds.length < 7 ? `<span class="picker" id="picker" hidden><input id="pickq" placeholder="Search a dataset to add…" autocomplete="off" aria-label="Search a dataset to add"><ul id="pickres" hidden></ul></span>
      <button class="addbtn" id="addbtn" aria-expanded="false">+ Add series</button>` : '<span class="note">Up to 7 series</span>');
}
function pickSearch(qq){
  const terms = qq.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.length) return [];
  return CAT.map(x => { const hay = (x.t + ' ' + x.id + ' ' + x.src + ' ' + x.tp + ' ' + x.ent).toLowerCase();
    return terms.every(t => hay.includes(t)) ? [x, terms.reduce((a, t) => a + (x.t.toLowerCase().includes(t) ? 3 : 1), 0) * (1 + x.rk)] : null; })
    .filter(Boolean).sort((a, b) => b[1] - a[1]).slice(0, 10).map(r => r[0]).filter(x => !plotIds.includes(x.id));
}
async function showSeries(id){
  const s = BY.get(id), v = $('#view');
  if (!s) { crumbs([['Datasets']]); v.innerHTML = `<h1>Dataset not found</h1><p class="lede">No series <code>${esc(id)}</code> in this build. Search the catalogue on the left.</p>`; return; }
  crumbs([[s.dset, null], [s.tp, null], [s.t]]);
  const inC = compare.includes(id);
  const twins = s.c ? CAT.filter(x => x.c === s.c && x.id !== id) : [];
  v.innerHTML = `<div class="head"><div class="headrow"><h1>${esc(s.t)}</h1></div>
    <div class="badges"><span class="badge mono">${esc(s.id)}</span><span class="badge" title="Dataset">${esc(s.dset)}</span><span class="badge">${esc(s.f)}</span>
      <span class="badge">${esc(s.ent)}</span><span class="pill ${s.st}">${esc(s.st)}</span>${s.r !== 'canonical' ? `<span class="pill ${s.r}">${esc(s.r)}</span>` : ''}
      <div class="actions"><button class="btn" data-add="${esc(id)}" aria-pressed="${inC}">${inC ? 'In compare' : '+ Compare'}</button>
      <button class="btn" id="copyCsv">Copy CSV</button><button class="btn primary" data-prompt="${esc(id)}">Copy prompt</button></div></div>
    ${s.ds ? `<p class="lede">${esc(s.ds)}</p>` : ''}</div>
    <div class="stabs-slot"></div><div id="sp-chart" role="tabpanel" aria-labelledby="st-chart" ${stab === 'chart' ? '' : 'hidden'}>
    <div class="panel"><div class="plotbar" id="plotbar"></div><div class="panel-h" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-top:.25rem">
      <div class="modes" role="group" aria-label="Scale" style="margin-left:0">${[['auto', 'Auto'], ['level', 'Level'], ['index', 'Index = 100'], ['yoy', '1-year %']].map(([m, l]) =>
        `<button data-pmode="${m}" aria-pressed="${plotMode === m}">${l}</button>`).join('')}</div>
      <div class="ranges" role="group" aria-label="Time range">${['5Y', '10Y', '20Y', 'All'].map(r => `<button data-r="${r}" aria-pressed="${r === 'All'}">${r}</button>`).join('')}</div></div>
      <div class="panel-b"><div class="chart" id="sChart" role="img" aria-label="${esc(s.t)} over time"></div><div id="sPol"></div></div></div>
    ${twins.length ? `<div class="panel"><div class="panel-h"><h3>Same concept, other sources</h3></div><div class="panel-f">${chips(twins.map(t => t.id))}</div></div>` : ''}
    </div>
    <div class="stabs" role="tablist" aria-label="Dataset views">
      <button role="tab" id="st-chart" aria-selected="${stab === 'chart'}" aria-controls="sp-chart" data-stab="chart">Chart</button>
      <button role="tab" id="st-details" aria-selected="${stab === 'details'}" aria-controls="sp-details" data-stab="details">Details</button></div>
    <div id="sp-details" role="tabpanel" aria-labelledby="st-details" ${stab === 'details' ? '' : 'hidden'}>
    <div class="panel"><div class="panel-h"><h3>Table preview</h3></div><div class="tbl" id="sTable"><p class="note" style="padding:.75rem">Loading…</p></div></div>
    <div class="panel"><div class="panel-h"><h3>Schema</h3><p>Row shape in the <code>observations</code> table and the <code>v_observations</code> view (DuckDB, Parquet).</p></div><div class="tbl"><table>
      <thead><tr><th>Name</th><th>Type</th><th>Description</th></tr></thead><tbody>
      <tr><td class="mono">series_id</td><td class="mono">varchar</td><td>Always <code>${esc(s.id)}</code> for this dataset</td></tr>
      <tr><td class="mono">date</td><td class="mono">date</td><td>${esc(s.f)} observation date${s.f === 'annual' ? ' (year end)' : s.f === 'monthly' ? ' (first of month)' : s.f === 'quarterly' ? ' (quarter end)' : ''}</td></tr>
      <tr><td class="mono">value</td><td class="mono">double</td><td>${esc(s.u || '—')}</td></tr></tbody></table></div></div>
    <div class="panel"><div class="panel-h"><h3>About</h3></div><div class="tbl"><table><tbody>${[['Dataset', s.dset], ['Publisher', s.src], ['Topic', s.tp], ['Entity', s.ent], ['Frequency', s.f],
      ['Unit', s.u || '—'], ['Coverage', s.a + ' → ' + s.b], ['Observations', s.n.toLocaleString('en')], ['Latest', fmt(s.lv) + ' (' + s.b + ')'], ['Role', s.r + (s.c ? ' · concept ' + s.c : '')],
      ['Used in tests', s.used || '—'], ['Source code', s.m]].map(([k, val]) => `<tr><th style="width:11rem">${k}</th><td class="wrap">${esc(val)}</td></tr>`).join('')}</tbody></table></div></div>
    </div>
`;
  // move the tab bar above both panels
  const bar = v.querySelector('.stabs'); v.querySelector('.stabs-slot').replaceWith(bar);
  const d = await series(id);

    `<tr><td class="mono">${esc(id)}</td><td class="mono">${x}</td><td class="n mono">${y == null ? '—' : y.toLocaleString('en', {maximumFractionDigits: 6})}</td></tr>`).join('')}</tbody></table>
    <span class="rows-n">${d.x.length.toLocaleString('en')} rows · latest 10 shown</span>`;

}
function copy(text, btn, msg){
